spring:
  application:
    name: Noleggio
  datasource:
    # le credenziali si passano come variabili d'ambiente, non si scrivono qui (il file va nella repo)
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # lo schema noleggio si crea con src/main/resources/other/database_mysql.sql
    url: jdbc:mysql://localhost:3306/noleggio?serverTimezone=Europe/Rome
  jpa:
    hibernate:
      # le tabelle le crea lo script SQL; all'avvio Hibernate controlla solo che
      # le @Entity corrispondano alle tabelle e, se non corrispondono, non parte
      ddl-auto: validate
    # stampa nel log le query SQL eseguite
    show-sql: true
    # dialetto SQL che Hibernate usa per generare le query. Vuoto = lo ricava dal driver (MySQL, Claudia);
    # con MariaDB va indicato a mano (DB_PLATFORM=org.hibernate.dialect.MariaDBDialect, Davide),
    # perché il driver MySQL non riesce a leggere i metadata di MariaDB
    database-platform: ${DB_PLATFORM:}
# variabili utili a tutto il sistema richiamabili tramite @Value
noleggio:
  tolleranza-ritiro-minuti: 30
  max-prenotazioni-attive: 2
  max-mezzi-per-prenotazione: 10
