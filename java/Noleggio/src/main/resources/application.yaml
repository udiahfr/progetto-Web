spring:
  application:
    name: Noleggio
  datasource:
    # le credenziali si passano come variabili d'ambiente, non si scrivono qui (il file va nella repo)
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # createDatabaseIfNotExist: se lo schema noleggio non esiste, MySQL lo crea al primo avvio
    url: jdbc:mysql://localhost:3306/noleggio?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
  jpa:
    hibernate:
      # Hibernate crea e aggiorna le tabelle partendo dalle @Entity
      ddl-auto: update
    # stampa nel log le query SQL eseguite
    show-sql: true
